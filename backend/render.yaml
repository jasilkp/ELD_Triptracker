databases:
  - name: eldtrip-db
    databaseName: eldtrip
    user: eldtrip
    plan: free

services:
  - type: web
    name: eldtrip-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py collectstatic --noinput && python manage.py migrate && gunicorn eldtrip.wsgi:application --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eldtrip-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false   # you will fill this in with your Render subdomain after first deploy
      - key: OPENROUTESERVICE_API_KEY
        sync: false   # paste your ORS key in the Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # paste your Vercel frontend URL after you deploy it
